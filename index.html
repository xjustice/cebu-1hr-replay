<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cebu 1-Hour Replay | Premium Cinematic Experience</title>
    <meta name="description" content="Experience the beat of Cebu with a 1-hour continuous cinematic playback. Perfect for focus, relaxation, or virtual travel.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00ecff;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
            display: none; /* Initially hidden */
        }

        #video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay for UI */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
            display: none; /* Hidden until start */
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
            pointer-events: none;
        }

        .ui-layer * { pointer-events: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title-box h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #timer {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .progress-container {
            flex-grow: 1;
            height: 4px;
            background: var(--glass-bg);
            border-radius: 2px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            transition: width 1s linear;
        }

        /* Start Overlay */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        #start-button {
            padding: 1.5rem 3rem;
            font-size: 1.2rem;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        #start-button:hover {
            box-shadow: 0 0 30px var(--accent-color);
            transform: scale(1.05);
        }

        .hidden { display: none !important; }
        .flex { display: flex !important; }
    </style>
</head>
<body>
    <div id="start-overlay">
        <h1 style="color: #fff; font-size: 2.5rem; text-align: center; margin-bottom: 0.5rem;">Cebu Replay</h1>
        <p style="opacity: 0.6; margin-bottom: 2rem;">1 Hour Continuous Cinematic Playback</p>
        <button id="start-button">START SESSION</button>
    </div>

    <div id="video-wrapper">
        <!-- Using direct iframe embed for maximum compatibility -->
        <iframe id="main-player" 
                src="" 
                allow="autoplay; fullscreen" 
                allowfullscreen></iframe>
    </div>

    <div class="ui-layer" id="ui-layer">
        <header>
            <div class="title-box">
                <h1>The NU Beat of Cebu</h1>
                <p>1-Hour Auto-Looping Experience</p>
            </div>
            <div class="timer-box">
                <div id="timer">60:00</div>
            </div>
        </header>

        <footer>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <p style="font-size: 0.8rem; opacity: 0.5;">LIVE REPLAY SESSION</p>
        </footer>
    </div>

    <script>
        const videoId = 'Cl078T7Oq2M'; // Original video requested
        const totalDuration = 3600;
        let remaining = totalDuration;

        const startBtn = document.getElementById('start-button');
        const startOverlay = document.getElementById('start-overlay');
        const videoWrapper = document.getElementById('video-wrapper');
        const uiLayer = document.getElementById('ui-layer');
        const mainPlayer = document.getElementById('main-player');
        const timerDisplay = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');

        startBtn.addEventListener('click', () => {
            // Set the iframe source only on click to ensure autoplay permission
            // Using standard embed URL with looping parameters
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0`;
            
            mainPlayer.src = embedUrl;
            
            startOverlay.classList.add('hidden');
            videoWrapper.classList.add('flex');
            uiLayer.classList.add('flex');
            
            startTimer();
        });

        function startTimer() {
            const interval = setInterval(() => {
                remaining--;
                
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                const progress = ((totalDuration - remaining) / totalDuration) * 100;
                progressBar.style.width = `${progress}%`;

                if (remaining <= 0) {
                    clearInterval(interval);
                    mainPlayer.src = "";
                    alert('1시간 세션이 종료되었습니다.');
                }
            }, 1000);
        }

        // Simple mouse move detect to show/hide UI
        let uiTimeout;
        document.addEventListener('mousemove', () => {
            uiLayer.style.opacity = '1';
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => {
                if (remaining < totalDuration) uiLayer.style.opacity = '0.1';
            }, 3000);
        });
    </script>
</body>
</html>
